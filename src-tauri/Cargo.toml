[package]
name = "finance-control-desktop"
version = "0.0.1"
description = "App Controle Financeiro desktop shell"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
getrandom = "=0.4.3"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-single-instance = "=2.5.3"
